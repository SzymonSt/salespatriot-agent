[project]
name = "salespatriot-backend"
version = "0.1.0"
description = "SalesPatriot agent orchestration backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "google-adk>=1.0,<2",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["../.."]
testpaths = ["tests"]
