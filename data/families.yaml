# Product taxonomy: CPV class (level 1) -> product family (level 2), with a fixed attribute
# schema per family. Source of truth for the product_* tables in Supabase.
# Design, evidence and rules: knowledge_base/25-product-families.md
# Seed: python3 seed_product_taxonomy.py > seed.sql, then run seed.sql in Supabase (SQL editor, psql or MCP). Idempotent.
#
# Change rules
# - Observations (new items, new values) never change this file.
# - New families, attributes, enum values or keywords: open a proposal (product_taxonomy_proposals),
#   a person approves it, then edit this file in a PR and bump taxonomy_version.
# - Never rename a family id. Deprecate it (status: deprecated) and add a new one.

taxonomy_version: 1
released: "2026-10-30"
notes: "First release: 4 focus CPV classes + out-of-scope bucket. Built from 4,840 TED notices, 339 catalogue items and the knowledge base."

# ---------------------------------------------------------------------------------------------
# Attribute dictionary. One meaning per key across all families.
# type: text | number | integer | boolean | enum | enum_list | text_list | calibre
# unit: code from the EU measurement-unit authority table (MMT mm, GRM g, KGM kg, MTR m, SEC s, JOU J, MTS m/s)
#
# Quantity is NOT an item attribute (ePO: Purpose.hasTotalQuantity / OrderLine.hasQuantity). It lives on the
# line: product_items.quantity + product_items.unit, with unit in {H87 piece (rounds, pieces, sets), KGM, MTR, LTR}.
# For frameworks store the maximum stated quantity and keep min/max in extra.
# ---------------------------------------------------------------------------------------------
attributes:
  end_use:
    label: End use
    type: enum_list
    values: [military, law_enforcement, border_guard, customs, prison_service, sport, hunting, training, ceremonial, eod, civil_protection]
    description: Who uses the item, as stated or as implied by the buyer type.
  condition:
    label: Condition
    type: enum
    values: [new, surplus, refurbished, demilitarised]
    description: New production or existing stock.
  brand_model:
    label: Brand and model
    type: text
    description: Manufacturer and model or designation as stated (e.g. "Rheinmetall DM159", "CZ P-10 C").
  standards:
    label: Standards
    type: text_list
    description: Standards and specifications named in the text (STANAG, MIL-STD, AQAP clause, EN, C.I.P., SAAMI, national spec).
  nsn:
    label: NATO Stock Number
    type: text
    description: 13-digit NSN (4-digit FSC + 9-digit NIIN) when stated.
  part_number:
    label: Part number
    type: text
    description: Manufacturer part number when stated.
  compatible_platforms:
    label: Compatible platforms
    type: text_list
    description: Weapons, vehicles or systems the item is for (e.g. "HK416", "Krab", "Carl Gustaf M4", "Leopard 2").
  country_of_origin:
    label: Country of origin
    type: text
    description: ISO 3166-1 alpha-3 country where the item is made, if stated (input for D7 supply-chain checks).
  packaging:
    label: Packaging
    type: text
    description: Packaging as stated (boxes of 50, clips, bandoleers, cans, pallets).
  calibre:
    label: Calibre
    type: calibre
    description: "Canonical calibre code from product_calibres: '5.56x45', '9x19', '12ga', '40x46', '155mm', '.338'. Normalise spelling; never guess it from the weapon name alone."
  round_type:
    label: Round type
    type: enum_list
    values: [ball, armour_piercing, armour_piercing_incendiary, tracer, incendiary, high_explosive, he_dual_purpose, he_fragmentation, programmable_airburst, smoke, illumination, practice, practice_tracer, blank, marking, reduced_range, frangible, subsonic, match, expanding, dummy_inert]
    description: Functional type of the round(s). Several values for mixed belts or mixed lots.
  projectile_designation:
    label: Projectile designation
    type: text
    description: Bullet or projectile designation as stated (SS109, M855A1, M80, DM11, FMJ, JHP).
  bullet_weight_g:
    label: Bullet weight
    type: number
    unit: GRM
    description: Bullet or projectile weight in grams (convert grains x 0.0648).
  primer_type:
    label: Primer type
    type: enum
    values: [boxer, berdan, rimfire, electric, percussion]
    description: Primer system.
  case_material:
    label: Case material
    type: enum
    values: [brass, steel, aluminium, polymer, other]
    description: Cartridge case material.
  lead_free:
    label: Lead-free
    type: boolean
    description: Lead-free bullet and/or primer required or offered.
  link_type:
    label: Link or belt type
    type: text
    description: Link or belt designation and mix (e.g. "M27 links, 4:1 ball/tracer", "DM6").
  shotgun_load:
    label: Shotgun load
    type: enum
    values: [buckshot, slug, birdshot, breaching, less_lethal, blank]
    description: Load of a shotgun cartridge.
  shell_length_mm:
    label: Shell length
    type: number
    unit: MMT
    description: Shotgun shell length (70, 76 mm).
  fuze_type:
    label: Fuze type
    type: enum
    values: [point_detonating, base_detonating, time, proximity, multi_option, programmable, impact_delay, self_destruct, none]
    description: Fuze function.
  component_type:
    label: Component type
    type: enum
    values: [complete_round, projectile, unfilled_body, cartridge_case, primer, propellant, propelling_charge, fuze, booster, link, explosive_fill]
    description: Which part of a munition the line covers.
  net_explosive_quantity_g:
    label: Net explosive quantity
    type: number
    unit: GRM
    description: NEQ per unit in grams, if stated (drives ADR and storage limits).
  un_number:
    label: UN number
    type: text
    description: Dangerous-goods UN number if stated (e.g. "UN0012").
  adr_classification:
    label: ADR classification code
    type: text
    description: Hazard division and compatibility group if stated (e.g. "1.4S", "1.2E").
  max_range_m:
    label: Maximum range
    type: number
    unit: MTR
    description: Maximum or effective range in metres, as stated.
  grenade_type:
    label: Grenade type
    type: enum
    values: [fragmentation, blast_offensive, smoke, illumination, incendiary, practice, rifle_grenade]
    description: Type of a lethal or training hand/rifle grenade (stun and irritant grenades are less-lethal).
  fuze_delay_s:
    label: Fuze delay
    type: number
    unit: SEC
    description: Hand-grenade fuze delay in seconds.
  payload_type:
    label: Less-lethal payload
    type: enum_list
    values: [impact_sponge, impact_baton, rubber_ball, bean_bag, irritant_oc, irritant_cs, marking, flash_bang, multi_effect]
    description: Effect of a less-lethal munition.
  ordnance_type:
    label: Ordnance type
    type: enum
    values: [aerial_bomb, rocket, guided_missile, loitering_munition, torpedo, sea_mine, naval_decoy, land_mine_anti_tank, land_mine_anti_personnel, other]
    description: Kind of heavy ordnance.
  guidance:
    label: Guidance
    type: enum
    values: [unguided, guided, course_corrected]
    description: Guidance of rockets, bombs and projectiles.
  signal_type:
    label: Signal type
    type: enum
    values: [signal_flare, illumination_flare, smoke_signal, distress_signal, trip_flare, battlefield_simulator, thunderflash]
    description: Kind of pyrotechnic signal or effect.
  colour:
    label: Colour
    type: text
    description: Colour of smoke, star or marking.
  burn_time_s:
    label: Burn time
    type: number
    unit: SEC
    description: Burn time in seconds.
  explosive_type:
    label: Explosive type
    type: text
    description: Explosive as stated (TNT, PETN, RDX, PE4/C4, emulsion, black powder).
  explosive_form:
    label: Explosive form
    type: enum
    values: [block, sheet, cord, bulk, cartridge, shaped_charge, linear_cutting_charge, kit]
    description: Physical form of explosives or charges.
  initiation_system:
    label: Initiation system
    type: enum
    values: [electric, non_electric_shock_tube, electronic, detonating_cord, safety_fuse, none]
    description: Initiation system of detonators or charges.
  propellant_type:
    label: Propellant type
    type: text
    description: Propellant as stated (single-base, double-base, ball powder, modular charge).
  material:
    label: Material
    type: text
    description: Main material if it matters for the item (brass, steel, aluminium, polymer).
  action:
    label: Action
    type: enum
    values: [semi_automatic, select_fire, fully_automatic, bolt_action, pump_action, lever_action, single_shot, revolver, break_action]
    description: Operating action of a firearm.
  weapon_role:
    label: Weapon role
    type: enum
    values: [service, compact, subcompact, competition, training, assault_rifle, carbine, battle_rifle, semi_auto_rifle, sniper, designated_marksman, anti_materiel, light_mg, general_purpose_mg, heavy_mg, underbarrel, standalone, multi_shot, automatic, less_lethal, recoilless, shoulder_rocket, commando, light, medium, heavy, vehicle_mounted, towed, self_propelled_wheeled, self_propelled_tracked, air_defence_gun, rocket_artillery, naval_gun]
    description: Role of the weapon within its family (each family narrows the list).
  barrel_length_mm:
    label: Barrel length
    type: number
    unit: MMT
    description: Barrel length in mm (convert inches x 25.4).
  barrel_length_calibres:
    label: Barrel length in calibres
    type: text
    description: Artillery barrel length as stated (L/39, L/52).
  magazine_capacity:
    label: Magazine capacity
    type: integer
    description: Rounds per standard magazine.
  feed_type:
    label: Feed type
    type: enum
    values: [box_magazine, belt, drum, tubular, cylinder, single]
    description: How the weapon is fed.
  rail_interface:
    label: Rail interface
    type: enum_list
    values: [picatinny, m_lok, keymod, none]
    description: Accessory rail standard.
  optics_ready:
    label: Optics ready
    type: boolean
    description: Slide or receiver cut for a sight.
  mount_type:
    label: Mount type
    type: enum
    values: [handheld, bipod, tripod, vehicle, naval, pintle, baseplate]
    description: How the weapon is mounted.
  accuracy_moa:
    label: Accuracy
    type: number
    description: Required or guaranteed accuracy in minutes of angle.
  firearms_directive_category:
    label: Firearms Directive category
    type: enum
    values: [A, B, C]
    description: Category under Directive (EU) 2021/555 Annex I for civilian-market firearms. Derived by rules; not for military-only items.
  weight_kg:
    label: Weight
    type: number
    unit: KGM
    description: Weight in kg.
  part_type:
    label: Part type
    type: enum
    values: [barrel, bolt_or_breech, trigger_group, receiver, spring_kit, stock, handguard, grip, small_parts, repair_kit, magazine, suppressor, muzzle_device, mount, sling, holster, bipod, cleaning_kit, armourer_tool, gauge, sight, other]
    description: Kind of part or accessory.
  sight_technology:
    label: Sight technology
    type: enum
    values: [iron, red_dot, holographic, prism, telescopic, night_image_intensifier, thermal, clip_on, laser_aiming_module, fire_control_system]
    description: Technology of a weapon sight or aiming device.
  magnification:
    label: Magnification
    type: text
    description: Magnification as stated (1x, 1-6x, 3-18x).
  oem_authorised:
    label: OEM authorised
    type: boolean
    description: Original or OEM-authorised part required or offered.
  weapon_class_served:
    label: Weapon class served
    type: enum
    values: [small_arms, cannon, mortar, artillery, rocket_launcher]
    description: Kind of weapon the part is for.
  blade_type:
    label: Blade type
    type: enum
    values: [sword, sabre, dagger, bayonet, lance, knife, machete]
    description: Kind of bladed weapon.
  ceremonial:
    label: Ceremonial
    type: boolean
    description: For parade, honour guard or award use.
  misc_weapon_type:
    label: Weapon type
    type: enum
    values: [gas_pistol, gas_launcher, irritant_spray, signal_pistol, line_throwing_gun, conducted_energy_weapon, air_rifle, air_pistol, airsoft, paintball, crossbow, other]
    description: Kind of miscellaneous weapon.
  muzzle_energy_j:
    label: Muzzle energy
    type: number
    unit: JOU
    description: Muzzle energy in joules (air guns, less-lethal).

# ---------------------------------------------------------------------------------------------
# Classes (level 1) and families (level 2).
# attributes: list of keys, or {key: {required, match_key, values}} to override.
#   required: must be present on platform listings (agent-created offers/demands); never forced on TED extraction.
#   match_key: hard filter when both demand and supply state it.
# cpv: exact = the code alone decides; candidate = one of several, the text decides; related = outside our classes.
# evidence: counts from the 2026-10-30 TED pull (competition / result notices or lots), see KB 25.
# ---------------------------------------------------------------------------------------------
classes:
  - id: ammunition
    name: Ammunition
    description: CPV 35330000 Ammunition, plus explosives and pyrotechnics bought in the same notices.
    cpv: {exact: ["35330000"]}
    attributes: [end_use, condition, brand_model, standards, nsn, country_of_origin, packaging, un_number, adr_classification, net_explosive_quantity_g]
    families:
      - id: ammunition.small_calibre
        name: Small-calibre cartridges
        description: Fixed metallic cartridges for pistols, rifles and machine guns below 20 mm, up to and including 12.7 mm and 14.5 mm heavy machine-gun rounds.
        includes: [pistol cartridges, rifle cartridges, machine-gun belts, match and subsonic ammunition, sport and hunting rifle cartridges]
        excludes: [blanks and marking rounds (training_blank), less-lethal rounds (less_lethal), shotgun cartridges (shotgun), loose bullets cases primers powder (components)]
        attributes:
          calibre: {required: true, match_key: true}
          round_type: {match_key: true}
          projectile_designation: {}
          bullet_weight_g: {}
          primer_type: {}
          case_material: {}
          lead_free: {}
          link_type: {}
        cpv: {candidate: ["35331500", "35331000", "35331100"]}
        keywords: ["n[aá]boj", "naboj", "patron", "cartridge", "cartouche", "cartucho", "munizion", "amunicj", "munici", "laskemoon", "šovin", "lőszer", "streljiv", "munitie", "ammunition", "боеприпас", "патрон"]
        evidence: "Calibre found in 515 / 425 lot titles below 20 mm; top 5.56x45 (137/94), 9x19 (119/133), 7.62x51 (82/51); CPV 35331500 Cartridges in 440 / 426 notices."

      - id: ammunition.shotgun
        name: Shotgun cartridges
        description: Lethal shotgun cartridges (12, 16, 20 gauge) for police, military, sport and hunting.
        includes: [buckshot, slugs, birdshot, breaching rounds]
        excludes: [rubber and bean-bag shotgun rounds (less_lethal), shotgun blanks (training_blank)]
        attributes:
          calibre: {required: true, match_key: true}
          shotgun_load: {match_key: true}
          shell_length_mm: {}
          lead_free: {}
        cpv: {candidate: ["35331500", "35331000"]}
        keywords: ["brokov", "śrut", "srut", "schrot", "chevrotine", "perdig", "pallettone", "buckshot", "slug", "breneke", "kaliber 12", "kal\\. ?12", "12/70", "12/76", "gauge"]
        evidence: "12-gauge in 32 / 16 lot titles; distinct attributes (gauge, load, shell length) and often outside the military list."

      - id: ammunition.training_blank
        name: Training, blank and marking ammunition
        description: Blank, marking (FX, Simunition, UTM), reduced-range, frangible training and inert dummy or drill rounds.
        excludes: [practice rounds of medium and large calibre (stay in their calibre family with round_type practice)]
        attributes:
          calibre: {required: true, match_key: true}
          round_type: {match_key: true, values: [blank, marking, reduced_range, frangible, practice, dummy_inert]}
          compatible_platforms: {}
          colour: {}
        cpv: {candidate: ["35331500", "35331000"]}
        keywords: ["ślep", "slep", "cvičn", "ćwicz", "übung", "manöver", "exercice", "fogueo", "salve", "blank", "simunition", "utm", "marking", "znakuj", "treniņ", "trenin", "treening", "harjoitus", "addestr", "frangible", "dummy", "drill round", "atrap"]
        evidence: "Training/blank keywords in 133 / 68 lot titles (96 / 52 notices)."

      - id: ammunition.less_lethal
        name: Less-lethal munitions
        description: Impact rounds (sponge, baton, rubber), irritant projectiles and grenades, flash-bang and stun grenades, less-lethal shotgun and 37/40 mm rounds.
        attributes:
          calibre: {match_key: true}
          payload_type: {required: true, match_key: true}
          max_range_m: {}
          compatible_platforms: {}
        cpv: {candidate: ["35331300", "35331000", "35331500"], related: ["35200000"]}
        keywords: ["less[- ]?lethal", "non[- ]?lethal", "nieśmierc", "nesmrt", "neletál", "non létal", "gumow", "gumov", "kummi", "rubber", "bean ?bag", "lacrimog", "reizstoff", "slzn", "irritant", "pepper", "hukow", "oszałam", "flash[- ]?bang", "blendgranat", "zábleskov", "stun", "granades sonores", "défense", "lbd", "sponge"]
        evidence: "Catalogue: 34 of 339 items are less-lethal and police equipment; keyword hits 17 / 11 lot titles (undercount: many are in police notices outside the focus classes)."

      - id: ammunition.medium_calibre
        name: Medium-calibre cannon ammunition
        description: Cannon ammunition from 20 mm to 57 mm (20, 23, 25, 27, 30, 35, 40 mm L70, 57 mm), not 40 mm grenades.
        attributes:
          calibre: {required: true, match_key: true}
          round_type: {match_key: true}
          fuze_type: {}
          link_type: {}
          compatible_platforms: {}
        cpv: {candidate: ["35331000", "35331200", "35332000"]}
        keywords: ["30 ?mm", "25 ?mm", "35 ?mm", "23 ?mm", "20 ?mm", "57 ?mm", "bushmaster", "kanon", "cannon", "canon", "kanone", "apfsds", "hei-t", "tp-t", "ahead", "airburst"]
        evidence: "20-57 mm calibres (excl. 40 mm grenades) in about 120 / 40 lot titles; 30x173 and 25x137 also in catalogue items."

      - id: ammunition.grenade_40mm
        name: 40 mm grenade-launcher ammunition
        description: 40x46 low-velocity and 40x53 high-velocity grenades (HE, HEDP, practice, smoke, illumination).
        excludes: [40 mm less-lethal rounds (less_lethal), 40 mm L70 cannon rounds (medium_calibre)]
        attributes:
          calibre: {required: true, match_key: true, values: ["40x46", "40x53"]}
          round_type: {match_key: true}
          fuze_type: {}
          max_range_m: {}
          compatible_platforms: {}
        cpv: {candidate: ["35331300", "35331000"]}
        keywords: ["40 ?x ?46", "40 ?x ?53", "40 ?mm", "granat .*40", "gl ammunition", "granát.*40"]
        evidence: "40x46 in 18 / 15 and 40x53 in 3 / 3 lot titles, plus '40 mm' in 39 / 16; separate launchers and buyers."

      - id: ammunition.hand_grenade
        name: Hand and rifle grenades
        description: Fragmentation, offensive (blast), smoke, illumination, incendiary and practice hand grenades, and rifle grenades.
        excludes: ["stun, flash-bang and irritant grenades (less_lethal)", "40 mm grenades (grenade_40mm)"]
        attributes:
          grenade_type: {required: true, match_key: true}
          fuze_delay_s: {}
          compatible_platforms: {}
        cpv: {candidate: ["35331300"]}
        keywords: ["granat ręczn", "ruční granát", "ruční granat", "handgranat", "grenade à main", "granada de mano", "bomba a mano", "kézigránát", "hand grenade", "rifle grenade", "granat nasadk", "granát", "granat", "grenad", "гранат"]
        evidence: "CPV 35331300 Grenades in 119 / 146 notices; grenade keywords in 52 / 43 lot titles."

      - id: ammunition.mortar
        name: Mortar ammunition
        description: Mortar bombs (60, 81, 82, 98, 120 mm) with their propelling charges and fuzes, all functional types.
        attributes:
          calibre: {required: true, match_key: true}
          round_type: {match_key: true}
          component_type: {}
          fuze_type: {}
          max_range_m: {}
          compatible_platforms: {}
        cpv: {candidate: ["35331200", "35331000"]}
        keywords: ["moździerz", "mo[zź]dzierz", "minomet", "mörser", "mortier", "mortero", "mortaio", "mortar", "wurfgranat", "aknavet", "миномет", "mina moździerz"]
        evidence: "Mortar keywords in 24 / 13 lot titles; 60, 81 and 120 mm in about 20 / 20 lot titles; CPV 35322400 Mortars (weapons) in 41 / 53 notices."

      - id: ammunition.artillery
        name: Artillery, tank and naval gun ammunition
        description: Loaded projectiles, complete rounds and propelling charges for guns of 75 mm and above (artillery, tank, naval), not mortars.
        excludes: [fuzes, unfilled shell bodies and bulk propellant (components)]
        attributes:
          calibre: {required: true, match_key: true}
          round_type: {match_key: true}
          component_type: {match_key: true, values: [complete_round, projectile, propelling_charge, cartridge_case]}
          fuze_type: {}
          compatible_platforms: {}
          guidance: {}
        cpv: {candidate: ["35331200", "35331000", "35332000"]}
        keywords: ["155 ?mm", "105 ?mm", "122 ?mm", "152 ?mm", "120 ?x ?570", "125 ?mm", "76 ?mm", "artyler", "artiller", "dělostřel", "haubic", "howitz", "obus", "sprenggranat", "ładunek miotaj", "modular charge", "bmcs", "propelling charge"]
        evidence: "155 mm in 66 / 22 lot titles; 75 mm+ calibres (excl. mortar) in about 110 / 55 lot titles; CPV 35331200 Shells in 36 / 31 notices."

      - id: ammunition.heavy_ordnance
        name: Bombs, rockets, missiles, torpedoes and mines
        description: Air-delivered bombs, rockets, missiles and loitering munitions, torpedoes, sea mines, naval decoys and land mines.
        attributes:
          ordnance_type: {required: true, match_key: true}
          calibre: {match_key: true}
          guidance: {}
          compatible_platforms: {}
        cpv: {exact: ["35331400", "35332000", "35332100", "35332200", "35333000", "35333100", "35333200"]}
        keywords: ["bomb", "rakiet", "raket", "rocket", "roquette", "cohete", "razzo", "missile", "misil", "torped", "mina morsk", "sea mine", "naval mine", "decoy", "przeciwpancern", "protitankov", "land[- ]?mine", "loitering", "amunicja krążąca"]
        rules:
          - "ordnance_type = land_mine_anti_personnel -> always ESCALATE to a human (Ottawa Convention obligations differ between EU states)."
        evidence: "CPV bombs 37 / 37, rockets 12 / 15, land mines 24 / 15, naval 15 / 18, torpedoes 3 / 10, sea mines 4 / 5 notices."

      - id: ammunition.pyrotechnics
        name: Pyrotechnics and signals
        description: Signal and illumination flares, smoke signals, distress signals, trip flares, battlefield effects simulators and thunderflashes, including signal-pistol cartridges.
        excludes: [hand-thrown smoke grenades (hand_grenade), stun grenades (less_lethal)]
        attributes:
          signal_type: {required: true, match_key: true}
          colour: {}
          burn_time_s: {}
          calibre: {}
          max_range_m: {}
        cpv: {candidate: ["35331000"], related: ["39225500", "24613000"]}
        keywords: ["pyrotech", "pirotech", "sygnaliz", "signál", "signal", "flare", "raca", "leucht", "fumig", "fumog", "dymn", "dýmov", "smoke", "illumin", "oświetl", "osvětl", "symulator", "simulator", "imitac", "thunderflash", "distress"]
        evidence: "Pyro/signal keywords in 94 / 53 lot titles; CPV 39225500 Pyrotechnics co-occurs in 66 and 24613000 Signalling flares in 50 notices."

      - id: ammunition.explosives_demolition
        name: Explosives, demolition and initiation
        description: Bulk and plastic explosives, demolition and cutting charges, detonators, detonating cord, shock tube and initiation systems, EOD disposal explosives.
        attributes:
          explosive_form: {required: true, match_key: true}
          explosive_type: {}
          initiation_system: {match_key: true}
          net_explosive_quantity_g: {}
        cpv: {related: ["24600000", "24610000", "24615000"]}
        keywords: ["explosiv", "wybuchow", "trhavin", "sprengstoff", "esplosiv", "detonat", "zapalnik", "rozbušk", "zünder", "détonateur", "lont", "bleskovic", "sprengschnur", "cordeau", "shock tube", "demolit", "ładunek wybuch", "ładunk", "plastic explosive", "pe4", "c-4", "semtex", "tnt"]
        evidence: "Explosive/initiation keywords in 75 / 29 lot titles; CPV 24600000 Explosives co-occurs in 29 and 24615000 Fuses, caps, igniters and detonators in 20 notices; catalogue has 19 explosives items."

      - id: ammunition.components
        name: Ammunition components and energetic materials
        description: Bullets and projectiles, cartridge cases, primers, propellant powders, fuzes, boosters, links and clips, unfilled shell bodies. Tier-2/3 inputs for ammunition makers.
        attributes:
          component_type: {required: true, match_key: true}
          calibre: {match_key: true}
          propellant_type: {}
          material: {}
