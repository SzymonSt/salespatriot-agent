# ---------------------------------------------------------------------------------------------
# CPV codes that are noise when they are a notice's only focus code (checked 2026-10-30).
# ---------------------------------------------------------------------------------------------
noise_rules:
  - cpv: "35341100"
    label: Gunmetal pipe fittings
    rule: Noise when it is the only focus code of a notice or lot (bronze plumbing). Classify as out_of_scope.noise.
    evidence: "KB 21; 33 notices carry it as their only focus code."
  - cpv: "35311400"
    label: Lances
    rule: Noise when it is the only focus code and the text is about fire-fighting or water (fire-hose nozzles are 'lances' in French). Classify as out_of_scope.noise.
    evidence: "11 of 14 notices with 35311400 are fire-fighting or water tenders (TED pull 2026-10-30)."

# ---------------------------------------------------------------------------------------------
# CPV supplementary vocabulary tags (http://data.europa.eu/cpv/cpvsuppl/<code>) that an item may carry
# as extra epo:hasItemClassification values. TED never publishes them; we derive them. (KB 25 §ePO)
# ---------------------------------------------------------------------------------------------
cpvsuppl_tags:
  FB01: {label: For military use, when: "end_use contains military"}
  FB02: {label: For weapons and ammunition, when: "class in ammunition, firearms, parts, misc_weapons"}
  FB03: {label: For the police force, when: "end_use contains law_enforcement"}
  FB13: {label: With military specifications, when: "standards contain a STANAG or MIL-STD"}
  AA44: {label: Brass, when: "case_material = brass"}
  AA11: {label: Steel, when: "case_material = steel"}
  AB06: {label: Plastic, when: "case_material = polymer"}
  DA44: {label: Spare parts, when: "family = parts.small_arms_parts or parts.heavy_weapon_parts"}

