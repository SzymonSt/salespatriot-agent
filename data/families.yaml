# ---------------------------------------------------------------------------------------------
# Sources for the crosswalk below (all opened 2026-10-30 unless noted). Key -> URL.
# ---------------------------------------------------------------------------------------------
sources:
  CML26: "https://data.consilium.europa.eu/doc/document/ST-5828-2026-INIT/en/pdf"   # EU Common Military List, Council 23 Feb 2026 (OJ C/2026/1640)
  PSC25: "https://www.acquisition.gov/sites/default/files/manual/PSC%20Manual%20April%202025.pdf"   # FSC groups 10/13 (US GSA, follows DLA H2)
  CN26: "https://eur-lex.europa.eu/eli/reg_impl/2025/1926/oj"   # Combined Nomenclature 2026
  FD: "https://eur-lex.europa.eu/eli/dir/2021/555/oj"   # Firearms Directive (EU) 2021/555
  R2541: "http://data.europa.eu/eli/reg/2025/41/oj"   # Firearms import/export regulation (recast), applies from 12 Feb 2029
  ADR25: "https://digitallibrary.un.org/record/4068196/files/ECE_TRANS_352-EN.pdf"   # ADR 2025 Table A
  COS: "https://oos-data.army.cz/cos/cos/"   # Czech defence standards = public national adoptions of STANAGs
  IT40: "https://www.difesa.it/assets/allegati/67605/20250326_granate_40x46mm_hedp_e_tp-m_con_pre_mer_all_tec.pdf"
  BAE155: "https://www.baesystems.com/dam/jcr:2b61caee-8578-43ab-9899-33e6312a642f/155mm_brochure_February_2026.pdf"
  CPVSUPPL: "http://data.europa.eu/cpv/cpvsuppl"
  UNSPSC: "https://worldoftaxonomy.com/system/unspsc_v24/node/46100000"   # mirror (secondary)

# ---------------------------------------------------------------------------------------------
# Regulatory and standards crosswalk per family.
# Row: [scheme, code, relation, status, source, note]
#   status: V = verified in the source, V2 = secondary source only, I = our inference (verified = false).
#   relation: exact = applies to the whole family; related = applies to some items (rule in the note).
# Item-level rules (calibre bands, ML1 vs ML2) are in KB 25 section 7; ADR codes are "typical": the real
# entry depends on the tested article (ADR 2.2.1.1.4).
# ---------------------------------------------------------------------------------------------
